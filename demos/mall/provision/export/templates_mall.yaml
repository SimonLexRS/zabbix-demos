    - uuid: ac2b6c5b15a148a099ff750048458022
      template: 'Mall KPIs by ClickHouse'
      name: 'Mall KPIs by ClickHouse'
      description: 'Salidas del estacionamiento y tarjetas de regalo, calculadas desde las trazas en ClickHouse.'
      groups:
        - name: Templates/Mall
      items:
        - uuid: 5a2a4e76dfce47b7bee3b961eff3d336
          name: 'Mall: consulta de KPI a ClickHouse'
          type: HTTP_AGENT
          key: mall.kpi.get
          delay: 30s
          history: 1h
          value_type: TEXT
          timeout: 15s
          url: '{$CH.URL}'
          posts: |
            WITH
                toDate(Timestamp, 'America/Mexico_City') = toDate(now(), 'America/Mexico_City') AS hoy,
                Timestamp > now() - toIntervalMinute(15) AS ult_15m,
                ServiceName = 'estacionamiento' AND SpanName = 'POST /salida' AS es_salida,
                ServiceName = 'giftcards' AND SpanName = 'POST /compra' AS es_tarjeta,
                StatusCode = 'Error' AS fallo,
                toFloat64OrZero(SpanAttributes['mall.monto']) AS monto
             SELECT
                countIf(hoy AND es_salida AND NOT fallo) AS salidas_hoy,
                round(sumIf(monto, hoy AND es_salida AND NOT fallo)) AS recaudacion_estacionamiento_hoy,
                countIf(hoy AND es_tarjeta AND NOT fallo) AS tarjetas_hoy,
                round(sumIf(monto, hoy AND es_tarjeta AND NOT fallo)) AS recaudacion_tarjetas_hoy,
                countIf(ult_15m AND es_salida AND NOT fallo) AS salidas_15m,
                countIf(ult_15m AND es_salida AND fallo) AS salidas_fallidas_15m
            FROM zabbix.otel_traces
            WHERE Timestamp > now() - toIntervalHour(24)
              AND ResourceAttributes['service.namespace'] = '{$MALL.NS}'
              AND SpanKind = 'Server'
             FORMAT JSONEachRow
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
        - uuid: 8e92c73bcc1e4a01ad504c5045938c63
          name: 'Negocio: recaudación del estacionamiento hoy'
          type: DEPENDENT
          key: 'mall.kpi[recaudacion_estacionamiento_hoy]'
          value_type: FLOAT
          units: MXN
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.recaudacion_estacionamiento_hoy
          master_item:
            key: mall.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 26c794b96fb443a3854745c50758593a
          name: 'Negocio: recaudación de tarjetas de regalo hoy'
          type: DEPENDENT
          key: 'mall.kpi[recaudacion_tarjetas_hoy]'
          value_type: FLOAT
          units: MXN
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.recaudacion_tarjetas_hoy
          master_item:
            key: mall.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 301fb96909a34c8bb5f4e96c4551d82b
          name: 'Negocio: salidas del estacionamiento en 15 min'
          type: DEPENDENT
          key: 'mall.kpi[salidas_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.salidas_15m
          master_item:
            key: mall.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: e7898a08cc344d0981912eb01dbbedeb
          name: 'Negocio: salidas fallidas en 15 min'
          type: DEPENDENT
          key: 'mall.kpi[salidas_fallidas_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.salidas_fallidas_15m
          master_item:
            key: mall.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: cf2d3f7b32b347118e985bc694edac93
          name: 'Negocio: salidas del estacionamiento hoy'
          type: DEPENDENT
          key: 'mall.kpi[salidas_hoy]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.salidas_hoy
          master_item:
            key: mall.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 7d4b6f7842494a4881bab03d10c8182a
          name: 'Negocio: tarjetas de regalo vendidas hoy'
          type: DEPENDENT
          key: 'mall.kpi[tarjetas_hoy]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.tarjetas_hoy
          master_item:
            key: mall.kpi.get
          tags:
            - tag: component
              value: negocio
      tags:
        - tag: demo
          value: mall
      macros:
        - macro: '{$CH.PASSWORD}'
          type: SECRET_TEXT
        - macro: '{$CH.URL}'
          value: 'http://clickhouse:8123/'
        - macro: '{$CH.USER}'
          value: zabbix
        - macro: '{$MALL.NS}'
          value: mall
